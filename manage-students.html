<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Siswa — Attendify</title><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body><main class="page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span>Attendify</a><nav id="main-nav" class="nav"><a href="scanner.html">Scanner</a><a href="manage-students.html">Siswa</a><a href="rekap.html">Rekap</a></nav><div class="actions"><button id="nav-toggle" class="icon-btn nav-toggle">☰</button><button id="theme-toggle" class="icon-btn">◐</button></div></header>
<div class="page-header"><div><p class="eyebrow">ADMIN</p><h1>Kelola Siswa</h1><p class="subtitle">Database siswa dan QR terhubung ke Google Sheets.</p></div></div>
<section class="form-card"><div class="form-grid"><label>NIS<input id="nis" placeholder="1006" autocomplete="off"></label><label>Nama Lengkap<input id="nama" placeholder="Nama siswa" autocomplete="off"></label><label>Kelas<input id="kelas" placeholder="XII IPA 1" autocomplete="off"></label></div><div class="actions" style="margin-top:16px"><button id="save" class="button">+ Tambah Siswa</button><button id="refresh" class="button secondary">↻ Refresh</button></div></section>
<section style="margin-top:24px"><div class="toolbar"><div><h2 style="margin-bottom:4px">Daftar Siswa</h2><span id="count" class="muted">Memuat...</span></div><input id="search" style="max-width:280px" placeholder="Cari NIS, nama, kelas..."></div><div id="student-list" class="student-grid" style="margin-top:16px"></div></section></main>
<script type="module">
import {jsonp,escapeHtml,toast,initTheme,initMobileNav} from './js/api.js';
initTheme();initMobileNav();
const list=document.getElementById('student-list'),search=document.getElementById('search'),count=document.getElementById('count');let students=[];
async function load(){list.innerHTML='<div class="empty">Memuat data siswa...</div>';try{const r=await jsonp({action:'students'});students=r.students||[];render()}catch(e){list.innerHTML='<div class="empty">Gagal memuat: '+escapeHtml(e.message)+'</div>';toast(e.message,'error')}}
function render(){const q=search.value.trim().toLowerCase();const data=students.filter(s=>[s.nis,s.nama,s.kelas].join(' ').toLowerCase().includes(q));count.textContent=students.length+' siswa terdaftar';list.innerHTML='';if(!data.length){list.innerHTML='<div class="empty">Tidak ada siswa yang cocok.</div>';return}data.forEach((s,i)=>{const card=document.createElement('article');card.className='student-card';const qrId='qr-'+i+'-'+Date.now();card.innerHTML='<div id="'+qrId+'" class="qr-box"></div><h3>'+escapeHtml(s.nama)+'</h3><p>NIS: '+escapeHtml(s.nis)+'</p><p>'+escapeHtml(s.kelas)+'</p><code>'+escapeHtml(s.qr)+'</code><div class="actions" style="justify-content:center;margin-top:12px"><button class="button secondary print">Cetak QR</button><button class="button danger del">Hapus</button></div>';list.appendChild(card);new QRCode(document.getElementById(qrId),{text:s.qr,width:155,height:155});card.querySelector('.print').onclick=()=>printQr(s);card.querySelector('.del').onclick=()=>remove(s)})}
function printQr(s){const w=window.open('','_blank','width=500,height=650');if(!w)return;w.document.write('<html><head><title>QR '+escapeHtml(s.nama)+'</title><style>body{font-family:Arial;text-align:center;padding:35px}img{margin:20px}h1{font-size:24px}</style></head><body><h1>'+escapeHtml(s.nama)+'</h1><p>'+escapeHtml(s.nis)+' · '+escapeHtml(s.kelas)+'</p><div id="qr"></div><p>'+escapeHtml(s.qr)+'</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\\/script><script>new QRCode(document.getElementById("qr"),{text:'+JSON.stringify(s.qr)+',width:260,height:260});setTimeout(()=>print(),400)<\\/script></body></html>');w.document.close()}
async function remove(s){if(!confirm('Hapus '+s.nama+'?'))return;try{await jsonp({action:'deleteStudent',nis:s.nis});toast('Siswa berhasil dihapus.','success');load()}catch(e){toast(e.message,'error')}}
document.getElementById('save').onclick=async()=>{const nis=document.getElementById('nis').value.trim(),nama=document.getElementById('nama').value.trim(),kelas=document.getElementById('kelas').value.trim();if(!nis||!nama||!kelas)return toast('Isi NIS, nama, dan kelas dulu.','warning');const b=document.getElementById('save');b.disabled=true;b.textContent='Menyimpan...';try{await jsonp({action:'addStudent',nis,nama,kelas});['nis','nama','kelas'].forEach(id=>document.getElementById(id).value='');toast('Siswa berhasil ditambahkan.','success');load()}catch(e){toast(e.message,'error')}finally{b.disabled=false;b.textContent='+ Tambah Siswa'}};search.oninput=render;document.getElementById('refresh').onclick=load;load();
</script></body></html>
