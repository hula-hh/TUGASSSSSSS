<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rekap — Attendify</title><link rel="stylesheet" href="css/style.css"></head>
<body class="dashboard-body"><main class="page">
<div class="page-header"><div><p class="eyebrow">REKAP ABSENSI</p><h1>Data Kehadiran</h1><p class="subtitle">Data langsung dari Google Sheets.</p></div><div class="actions"><a class="button secondary" href="scanner.html">Scanner</a><a class="button secondary" href="students.html">Siswa</a><a class="button secondary" href="index.html">Dashboard</a></div></div>
<section class="quick-grid" style="margin-bottom:24px"><div class="feature-card"><div><span class="card-label">TOTAL ABSENSI</span><h2 id="total">—</h2><p>Seluruh catatan.</p></div></div><div class="feature-card"><div><span class="card-label">HARI INI</span><h2 id="today">—</h2><p>Absensi hari ini.</p></div></div><div class="feature-card"><div><span class="card-label">TOTAL SISWA</span><h2 id="students">—</h2><p>Siswa terdaftar.</p></div></div></section>
<section class="table-wrap"><div style="padding:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:end"><label style="display:grid;gap:6px">Tanggal<input id="date" type="date" style="padding:10px;border-radius:8px;border:1px solid #d8dee8;font:inherit"></label><label style="display:grid;gap:6px">Mapel<select id="mapel" style="padding:10px;border-radius:8px;border:1px solid #d8dee8;font:inherit"><option value="">Semua Mapel</option><option>Informatika</option><option>Matematika</option><option>Biologi</option><option>Fisika</option><option>Kimia</option><option>Bahasa Indonesia</option><option>Bahasa Inggris</option></select></label><button id="refresh" class="button" type="button">Refresh</button></div><table><thead><tr><th>No</th><th>Nama</th><th>NIS</th><th>Kelas</th><th>Mapel</th><th>Tanggal</th><th>Waktu</th><th>Status</th></tr></thead><tbody id="body"></tbody></table><div id="msg" class="empty">Memuat data...</div></section>
</main><script>
const API='https://script.google.com/macros/s/AKfycbwlXsfOzHtXYSkQWeWPHRqx523TwplWugftV36teujhuS-bAOtY9HDKVYswdqbRW3T1Ug/exec';let records=[];
function jsonp(p){return new Promise((ok,no)=>{const c='cb'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({...p,callback:c}),t=setTimeout(()=>{x();no(Error('Server tidak merespons.'))},10000);function x(){clearTimeout(t);delete window[c];s.remove()}window[c]=d=>{x();ok(d)};s.onerror=()=>{x();no(Error('Gagal terhubung ke server.'))};s.src=API+'?'+q;document.body.appendChild(s)})}
function render(){const d=document.getElementById('date').value,m=document.getElementById('mapel').value.toLowerCase(),b=document.getElementById('body'),msg=document.getElementById('msg'),data=records.filter(r=>(!d||String(r.tanggal)===d)&&(!m||String(r.mapel).toLowerCase()===m));b.innerHTML='';msg.hidden=data.length>0;data.forEach((r,i)=>{const tr=document.createElement('tr');[i+1,r.nama,r.nis,r.kelas,r.mapel,r.tanggal,r.waktu,r.status].forEach((v,n)=>{const td=document.createElement('td');if(n===7){const z=document.createElement('span');z.className='badge';z.textContent=v;td.appendChild(z)}else td.textContent=v;tr.appendChild(td)});b.appendChild(tr)})}
async function load(){const msg=document.getElementById('msg');msg.hidden=false;msg.textContent='Memuat data...';try{const [a,s]=await Promise.all([jsonp({action:'attendanceRecords'}),jsonp({action:'students'})]);if(!a.success)throw Error(a.message||'Gagal mengambil data.');records=a.records||[];document.getElementById('total').textContent=records.length;const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});document.getElementById('today').textContent=records.filter(r=>String(r.tanggal)===today).length;document.getElementById('students').textContent=s.success?(s.students||[]).length:'—';render()}catch(e){msg.hidden=false;msg.textContent='Gagal memuat data: '+e.message}}
document.getElementById('date').onchange=render;document.getElementById('mapel').onchange=render;document.getElementById('refresh').onclick=load;load();
</script></body></html>
