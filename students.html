<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Siswa — Attendify</title><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><main class="page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span>Attendify</a><nav id="main-nav" class="nav"><a href="scanner.html">Scanner</a><a href="manage-students.html">Siswa</a><a href="rekap.html">Rekap</a></nav><div class="actions"><button id="nav-toggle" class="icon-btn nav-toggle">☰</button><button id="theme-toggle" class="icon-btn">◐</button></div></header><div class="page-header"><div><p class="eyebrow">DATABASE SISWA</p><h1>QR Code Siswa</h1><p class="subtitle">Halaman khusus untuk menampilkan dan mencetak QR dari database terbaru.</p></div><a class="button" href="manage-students.html">Kelola Siswa</a></div><div id="state" class="panel" style="margin-bottom:18px;text-align:center">Memuat data...</div><div id="student-list" class="student-grid"></div></main><script type="module">
import {jsonp,escapeHtml,initTheme,initMobileNav} from './js/api.js';initTheme();initMobileNav();const list=document.getElementById('student-list'),state=document.getElementById('state');
async function load(){try{const r=await jsonp({action:'students'}),students=r.students||[];state.textContent=students.length+' siswa terdaftar';list.innerHTML='';students.forEach((s,i)=>{const c=document.createElement('article');c.className='student-card';const id='qr'+i;c.innerHTML='<div id="'+id+'" class="qr-box"></div><h3>'+escapeHtml(s.nama)+'</h3><p>NIS: '+escapeHtml(s.nis)+'</p><p>'+escapeHtml(s.kelas)+'</p><code>'+escapeHtml(s.qr)+'</code>';list.appendChild(c);new QRCode(document.getElementById(id),{text:s.qr,width:160,height:160})})}catch(e){state.textContent='Gagal memuat data: '+e.message}}load();
</script></body></html>
